{% extends "base.html" %}

{% block content %}
  <h2>Book #{{ book["id"] }}</h2>

  <p><strong>Title:</strong> {{ book["title"] }}</p>
  <p><strong>Author:</strong> {{ book["author"] }}</p>
  <p><strong>Views:</strong> {{ book["views"] }}</p>

  <p><a href="{{ url_for('get_books') }}">Back to all books</a></p>
{% endblock %}
