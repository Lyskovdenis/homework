{% extends "base.html" %}

{% block content %}
  <h2>Books by {{ author_name }}</h2>

  <p><a href="{{ url_for('get_books') }}">Back to all books</a></p>

  {% if books %}
    <table class="customTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
        </tr>
      </thead>
      <tbody>
      {% for book in books %}
        <tr>
          <td>{{ book["id"] }}</td>
          <td>{{ book["title"] }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No books found for this author.</p>
  {% endif %}
{% endblock %}
