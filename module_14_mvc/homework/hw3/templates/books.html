{% extends "base.html" %}

{% block content %}
  <h2>Books:</h2>

  <p><a href="{{ url_for('get_books_form') }}">Add new book</a></p>

  {% if books %}
  <table class="customTable">
      <thead>
      <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
      </tr>
      </thead>
      <tbody>
      {% for book in books %}
      <tr>
          <td>{{ book["id"] }}</td>
          <td>{{ book["title"] }}</td>
          <td>
            <a href="{{ url_for('get_author_books', author_name=book['author']) }}">
              {{ book["author"] }}
            </a>
          </td>
      </tr>
      {% endfor %}
      </tbody>
  </table>
  {% else %}
    <h2>Sorry, no books in DB.</h2>
  {% endif %}
{% endblock %}
