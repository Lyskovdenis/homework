name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask Flask-SQLAlchemy factory-boy Faker pytest flake8 black isort mypy

      - name: Run black
        run: python -m black --check .

      - name: Run isort
        run: python -m isort --check-only .

      - name: Run flake8
        run: python -m flake8 .

      - name: Run mypy
        run: python -m mypy --explicit-package-bases --ignore-missing-imports .

      - name: Run tests
        run: pytest
